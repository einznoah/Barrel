# Proxy (Upstream) Server
bindAddress: "0.0.0.0"
port: 25565
motd: "Barrel Proxy\nConnect to Bedrock Server"
# Check with mojang that a java player is who it says it is? (online|offline)
# With offline anybody can join under any name, as on a java server that has online-mode off.
javaAuth: online
# Only let in the java accounts that are listed in whitelist.json? (true|false)
# The file is next to this one and is kept like the whitelist of a java server: a list of entries with the uuid of
# an account and its name. An account is told by its uuid, the name is only there to read. The file is read again
# when it was changed. Who is turned away is printed with its uuid.
javaWhitelist: false

# Downstream server (bedrock)
bedrockAddress: "play.venitymc.com"
bedrockPort: 19132
# How the bedrock server is reached (raknet|nethernet)
# raknet is what most servers are reached over, the address and port above are those of the game.
# With nethernet the address and port above are where the server answers to http or https, the same address a
# bedrock client is given for such a server.
transport: raknet
# Use xbox login? (offline|online)
auth: online

# Keep players signed in to xbox, also after the proxy was restarted? (true|false)
# A login is saved in the accounts folder then, for the java account that signed in. With javaAuth offline the
# proxy does not check who a java player is: whoever joins with the name of a player that is signed in plays with
# its xbox account. Then only for a proxy nobody else can reach.
rememberLogins: false
